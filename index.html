<!DOCTYPE html>
<html lang="de">
<head>

<title>Halloween in Heidelsheim</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",Arial,sans-serif;background:#140c24;color:#222}

  .stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:1rem;font-weight:bold}

        background:#1d3527;box-shadow:0 0 0 4px #ff9800,0 0 30px rgba(255,152,0,.45)}
  #meer::after{content:"";position:absolute;inset:0;pointer-events:none;
        background:radial-gradient(circle at 50% 3%,rgba(255,244,200,.18),transparent 35%),linear-gradient(rgba(20,10,40,.25),rgba(20,10,40,.45))}
  .dorf{position:absolute;inset:0;width:100%;height:100%}
  .deko{position:absolute;transform:translate(-50%,-50%);font-size:1.6rem;pointer-events:none;z-index:1}
  .flatter{animation:flatter 2.4s ease-in-out infinite}
  .schweb{animation:schweb 4s ease-in-out infinite;opacity:.85}

  .insel{position:absolute;transform:translate(-50%,-50%);width:112px;border:none;background:none;z-index:3;
         cursor:pointer;text-align:center;font-family:inherit;padding:0}
  .insel .land{display:block;font-size:2rem;width:72px;height:58px;line-height:54px;margin:28px auto 0;border-radius:4px;
         background:radial-gradient(circle,#fff3c4,#ffb74d 80%);border:4px solid #4e342e;box-shadow:0 0 22px rgba(255,167,38,.7)}
  .insel .land::before{content:"";position:absolute;left:-10px;right:-10px;top:-30px;height:30px;background:#6d2f1b;
         clip-path:polygon(50% 0,100% 100%,0 100%)}
  .insel .land::after{content:"🎃";position:absolute;left:-14px;bottom:-8px;font-size:1.1rem;line-height:1;text-shadow:none}
  .insel .name{display:inline-block;margin-top:6px;background:rgba(43,24,70,.92);color:#ffcc80;border:1px solid #ff9800;border-radius:10px;
         padding:2px 8px;font-size:.8rem;font-weight:bold;line-height:1.25}
  .insel .name small{display:block;font-weight:normal;color:#e1bee7;font-size:.72rem}
  .insel .land{position:relative}
  .haken{position:absolute;right:-14px;top:-40px;font-size:1.6rem;line-height:1;text-shadow:none}
  .schatz{position:absolute;transform:translate(-50%,-50%);width:124px;border:none;background:none;cursor:pointer;text-align:center;font-family:inherit;padding:0;z-index:3}
  .schatz .truhe{position:relative;display:block;font-size:3rem;width:84px;height:84px;line-height:80px;margin:0 auto;border-radius:50%;
         background:#3e2723;border:4px solid #1b0f0b;box-shadow:0 4px 0 #120806;filter:grayscale(.4)}
  .schatz .schloss{position:absolute;right:-6px;bottom:-6px;font-size:1.5rem;line-height:1}
  .schatz .name{display:inline-block;margin-top:4px;background:rgba(43,24,70,.92);color:#ffcc80;border:1px solid #ff9800;border-radius:10px;padding:2px 8px;font-size:.8rem;font-weight:bold}
  .schatz.offen .truhe{background:#ff9800;border-color:#ffe082;box-shadow:0 0 30px #ffb300,0 4px 0 #e65100;filter:none;animation:puls 1.2s infinite}
  .fehlt{line-height:1.7;font-weight:bold}

  #boot{position:absolute;font-size:3.2rem;line-height:1;transform:translate(-50%,-50%);pointer-events:none;z-index:4;transition:left 1s ease,top 1s ease;
        filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}

         pointer-events:none;z-index:30;opacity:0}

    45%{transform:translate(-50%,-50%) scale(1) rotate(10deg)}

    100%{transform:translate(-50%,-50%) scale(1.1) rotate(0);opacity:0}}

  .lw{background:#fff;border:2px dashed #1565c0;border-radius:12px;padding:10px;margin-top:12px;color:#0d47a1;overflow-x:auto}
  .lwtitel{font-weight:bold;margin-bottom:6px}
  .lwz{display:flex;flex-direction:column;gap:3px;font-size:1.1rem;margin:4px 0}
  .as{margin-top:8px;font-size:1.05rem;border-top:1px solid #90caf9;padding-top:6px}
  .kp{display:inline-grid;grid-auto-rows:26px;margin:6px auto;border-left:1px solid #b0bec5;border-top:1px solid #b0bec5}
  .kp span{border-right:1px solid #b0bec5;border-bottom:1px solid #b0bec5;font-size:1.15rem;line-height:25px;text-align:center;color:#0d47a1}

  .kp span.erg{border-top:2px solid #0d47a1;font-weight:bold}
  .reihe{display:flex;align-items:flex-end;justify-content:center;flex-wrap:nowrap;gap:1px;margin:6px 0;font-size:1rem;white-space:nowrap}
  .reihe b{padding:0 2px}
  .sp{display:inline-flex;flex-direction:column;align-items:center;color:#1565c0;font-size:.75rem;margin-bottom:14px}
  .sp i{width:20px;height:8px;border:2px solid #1565c0;border-bottom:none;border-radius:12px 12px 0 0}
  .strahl{max-width:100%;height:auto;margin:4px auto 8px;display:block}
  .strahl text{font-size:13px;font-family:inherit}
  .wahl{display:grid;gap:8px;margin-top:6px}
  .wahl button{font-family:inherit;font-size:1.15rem;padding:10px;border:3px solid #c9a24e;border-radius:12px;background:#fff;cursor:pointer}
  .wahl button:disabled{cursor:default}
  .wahl button.richtig{background:#c8e6c9;border-color:#2e7d32}
  .wahl button.falsch{background:#ffcdd2;border-color:#c62828;text-decoration:line-through}
  .unten{text-align:center;padding-bottom:20px}
  .version{margin-top:14px;color:#b39ddb;font-size:.8rem;letter-spacing:.04em}
  .unten button{background:#6a1b9a;color:#ffcc80;box-shadow:0 4px 0 #38006b}
</style>
</head>
<body>
<header>

  <div class="stats">
    <span>🍬 Süßigkeiten: <span id="coins">0</span></span>

<p class="hinweis" style="margin-top:12px">🎃 Tippe auf ein Haus, dann hüpft dein Kürbis hin. Süßes oder Saures? Hat jedes Haus einen Haken ✅, öffnet sich der große Kürbis-Kessel am Marktplatz!</p>
<div id="meer">
  <svg class="dorf" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">

    <rect x="0" y="0" width="12" height="18" fill="#26422e"/><rect x="88" y="16" width="12" height="20" fill="#2c4a2c"/>

    <path d="M0 57 Q20 52 38 59 T70 60 T100 56" fill="none" stroke="#1e4f8f" stroke-width="22" vector-effect="non-scaling-stroke"/>

  <div class="deko" style="left:36%;top:84%">🎃</div><div class="deko" style="left:66%;top:89%">🎃</div><div class="deko" style="left:6%;top:33%">🌳</div>
  <div class="deko" style="left:94%;top:66%">🌳</div><div class="deko" style="left:6%;top:66%">🍂</div><div class="deko" style="left:94%;top:93%">🌳</div>

<script>
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
// Tausendertrennung mit Punkt (1.365, 22.251)
const tsd=x=>x.replace(/\B(?=(\d{3})+(?!\d))/g,".");
const fmt=n=>{const [i,d]=String(n).split(".");return tsd(i)+(d?","+d:"");};
// in fertigem Aufgabentext alle Zahlen ab 1000 trennen (nur im Text, nie in HTML-/SVG-Attributen)
const trenne=h=>typeof h!=="string"?h:h.replace(/(^|>)([^<]*)/g,(m,a,t)=>a+t.replace(/\d{4,}/g,tsd));
const p2=x=>String(x).padStart(2,"0");
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}

const fmtE=c=>`${fmt(Math.floor(c/100))},${p2(c%100)} €`;
const fE=c=>c%100===0?`${fmt(c/100)} €`:fmtE(c);   // 5 € statt 5,00 € – wie in der Musterlösung
const karten=arr=>`<div class="karten">${arr.map(x=>`<span>${x}</span>`).join("")}</div>`;
function distinct(n,a,b){const s=new Set();while(s.size<n)s.add(rnd(a,b));return[...s];}
const zeilen=(...z)=>`<div class="lwz">${z.filter(Boolean).map(x=>`<div>${x}</div>`).join("")}</div>`;
const antwort=t=>`<div class="as">A: ${t}</div>`;

/* Kästchenpapier für schriftliches Rechnen (Übertrag bzw. Entbündeln wie in der Musterlösung) */
function schriftlich(a,b,op){
  const A=String(a).split("").map(Number),B=String(b).split("").map(Number),r=op==="+"?a+b:a-b,R=String(r).split("").map(Number);
  const W=Math.max(A.length,B.length,R.length)+1,pad=x=>Array(W-x.length).fill(null).concat(x);
  const top=pad(A),bot=pad(B),res=pad(R),klein=Array(W).fill(""),kreis=Array(W).fill(false),ue=Array(W).fill("");
  if(op==="+"){let c=0;for(let i=W-1;i>=0;i--){const s=(top[i]||0)+(bot[i]||0)+c;c=s>=10?1:0;if(c&&i>0)ue[i-1]="1";}}
  else{const t=top.map(x=>x||0);
    for(let i=W-1;i>0;i--){const bi=bot[i]||0;if(t[i]<bi){let j=i-1;while(t[j]===0)j--;
      t[j]-=1;klein[j]=(klein[j]?klein[j]+" ":"")+t[j];kreis[j]=true;
      for(let k=j+1;k<i;k++){t[k]=9;klein[k]="9";kreis[k]=true;}
      t[i]+=10;klein[i]=(klein[i]?klein[i]+" ":"")+"⑩";kreis[i]=true;}}}
  const zelle=(x,cls="")=>`<span class="${cls}">${x===null||x===undefined?"":x}</span>`;
  let h="";
  if(op==="-")h+=klein.map(x=>zelle(x,"kl")).join("");
  h+=top.map((x,i)=>zelle(x,kreis[i]?"kr":"")).join("");
  h+=bot.map((x,i)=>zelle(i===0?(op==="+"?"+":"−"):x)).join("");
  if(op==="+")h+=ue.map(x=>zelle(x,"kl")).join("");
  h+=res.map(x=>zelle(x,"erg")).join("");
  return `<div class="kp" style="grid-template-columns:repeat(${W},26px)">${h}</div>`;
}
/* Zahlenreihe mit Sprung-Pfeilen */
function reihe(n){return `<div class="reihe">${n.map((v,i)=>{const d=i?v-n[i-1]:0;return (i?`<span class="sp"><small>${d>=0?"+":"−"}${fmt(Math.abs(d))}</small><i></i></span>`:"")+`<b>${fmt(v)}</b>`;}).join("")}</div>`;}
/* Zahlenstrahl mit Mitte */
function strahl(a,b,m){const x=v=>20+(v-a)/(b-a)*260;let t="";for(let i=0;i<=10;i++)t+=`<line x1="${20+i*26}" y1="${i%5?24:20}" x2="${20+i*26}" y2="${i%5?36:40}" stroke="#333" stroke-width="${i%5?1:2}"/>`;
  return `<svg class="strahl" viewBox="0 0 300 64" width="300" height="64"><line x1="10" y1="30" x2="292" y2="30" stroke="#333" stroke-width="2"/>${t}
  <text x="20" y="58" text-anchor="middle">${fmt(a)}</text><text x="280" y="58" text-anchor="middle">${fmt(b)}</text>
  <text x="${x((a+b)/2)}" y="14" text-anchor="middle" fill="#1565c0" font-weight="bold">${m===undefined?"?":fmt(m)}</text></svg>`;}
/* Zahlenstrahl mit n Sprüngen zu je k */
function sprungStrahl(n,k){const end=n*k+k,x=v=>14+v/end*272;let s="",t="";
  for(let i=0;i<n;i++){const x0=x(i*k),x1=x((i+1)*k);s+=`<path d="M${x0} 40 Q${(x0+x1)/2} 8 ${x1} 40" fill="none" stroke="#333" stroke-width="2"/><path d="M${x1-6} 33 L${x1} 40 L${x1-8} 40" fill="none" stroke="#333" stroke-width="2"/>`;}
  for(let v=0;v<=end;v++)t+=`<line x1="${x(v)}" y1="${v%10?37:34}" x2="${x(v)}" y2="${v%10?43:46}" stroke="#333" stroke-width="1"/>${v%10?"":`<text x="${x(v)}" y="60" text-anchor="middle">${v}</text>`}`;
  return `<svg class="strahl" viewBox="0 0 300 66" width="300" height="66"><line x1="10" y1="40" x2="292" y2="40" stroke="#333" stroke-width="2"/>${t}${s}</svg>`;}
/* Strichliste */
function striche(n){let s="",x=2;for(let g=0;g<Math.floor(n/5);g++){for(let i=0;i<4;i++)s+=`<line x1="${x+i*6}" y1="2" x2="${x+i*6}" y2="22" stroke="#1565c0" stroke-width="2"/>`;s+=`<line x1="${x-3}" y1="18" x2="${x+21}" y2="6" stroke="#1565c0" stroke-width="2"/>`;x+=32;}
  for(let i=0;i<n%5;i++){s+=`<line x1="${x}" y1="2" x2="${x}" y2="22" stroke="#1565c0" stroke-width="2"/>`;x+=6;}
  return `<svg width="${x+4}" height="24" viewBox="0 0 ${x+4} 24">${s}</svg>`;}

const FARBE={weiße:"#ffffff",graue:"#9e9e9e",gelbe:"#fdd835",grüne:"#43a047",rote:"#e53935",blaue:"#1e88e5",lila:"#8e24aa"};
function sack(cnt){let d=[];for(const [f,n] of Object.entries(cnt))for(let i=0;i<n;i++)d.push(`<i style="background:${FARBE[f]}"></i>`);
  return `<div class="sack"><div class="knoten"></div><div class="beutel">${shuffle(d).join("")}</div></div>`;}
function rad(n,g){let p="";for(let i=0;i<n;i++){const a0=i/n*2*Math.PI-Math.PI/2,a1=(i+1)/n*2*Math.PI-Math.PI/2;
  p+=`<path d="M50 50 L${50+45*Math.cos(a0)} ${50+45*Math.sin(a0)} A45 45 0 0 1 ${50+45*Math.cos(a1)} ${50+45*Math.sin(a1)} Z" fill="${i<g?"#9e9e9e":"#ffffff"}" stroke="#333" stroke-width="2"/>`;}
  return `<svg class="rad" viewBox="0 0 100 100" width="96" height="96">${p}</svg>`;}
function tabelle(kopf,z){return `<table class="tab"><tr>${kopf.map(k=>`<th>${k}</th>`).join("")}</tr>${z.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;}
function saeulen(daten,max){const H=150,ticks=[];for(let v=0;v<=max;v+=2)ticks.push(`<span style="bottom:${v/max*H-8}px">${v}</span>`);
  return `<div class="dia"><div class="yachse" style="height:${H}px">${ticks.join("")}</div><div class="flaeche" style="height:${H}px;background-size:100% ${2/max*H}px">${daten.map(d=>`<div class="saeule" style="height:${d.v/max*H}px"></div>`).join("")}</div></div><div class="xlab">${daten.map(d=>`<span>${d.l}</span>`).join("")}</div>`;}

function netz(z){const w=Math.max(...z.map(c=>c[0]))+1,h=Math.max(...z.map(c=>c[1]))+1,S=16;
  return `<svg viewBox="-2 -2 ${w*S+4} ${h*S+4}" width="${w*S+4}" height="${h*S+4}">${z.map(([x,y])=>`<rect x="${x*S}" y="${y*S}" width="${S}" height="${S}" fill="#ffe082" stroke="#5d4037" stroke-width="1.5"/>`).join("")}</svg>`;}

function laengeMM(){const t=pick(["mm","cm","m"]);let v,w;if(t==="mm"){v=rnd(10,99)*10;w=v;}else if(t==="cm"){v=rnd(5,99);w=v*10;}else{v=rnd(1,60);w=v*1000;}return{s:`${fmt(v)} ${t}`,w,t,v};}
function vierLaengen(){const l=[],mm=new Set();while(l.length<4){const x=laengeMM();if(mm.has(x.w)||l.filter(y=>y.t===x.t).length>=2)continue;mm.add(x.w);l.push(x);}return l;}

const PER_ISLAND=5;
const POS=[[20,9],[78,10],[19,27],[81,29],[17,44],[83,46],[22,76],[78,78],[50,91]];
const SCHATZ=[50,44];
let coins=0,fertig=[],cur=0,taskIdx=0,tries=0,tasks=[],islandCoins=0,best=0;
try{best=parseInt(localStorage.getItem("schatzinselRekord")||"0",10)||0;}catch(e){}

const meer=document.getElementById("meer"),boot=document.getElementById("boot");
const overlay=document.getElementById("overlay"),karte=document.getElementById("karte");

function updateStats(){
  document.getElementById("coins").textContent=coins;
  document.getElementById("inseln").textContent=anzahlFertig();
  document.getElementById("best").textContent=best;
}

const anzahlFertig=()=>islands.filter((_,i)=>fertig[i]).length;
const alleFertig=()=>anzahlFertig()===islands.length;

function drawMap(){
  meer.querySelectorAll(".insel,.schatz").forEach(b=>b.remove());
  islands.forEach((isl,i)=>{
    const b=document.createElement("button");
    b.className="insel"+(fertig[i]?" fertig":"");
    b.style.left=POS[i][0]+"%";b.style.top=POS[i][1]+"%";
    b.innerHTML=`<span class="land">${isl.icon}${fertig[i]?'<span class="haken">✅</span>':""}</span><span class="name">${isl.name}<small>${isl.thema}</small></span>`;
    b.onclick=()=>segleZu(i);
    meer.appendChild(b);
  });
  const s=document.createElement("button"),auf=alleFertig();
  s.className="schatz"+(auf?" offen":"");
  s.style.left=SCHATZ[0]+"%";s.style.top=SCHATZ[1]+"%";
  s.innerHTML=`<span class="truhe">${auf?"🍬":"🎃"}${auf?"":'<span class="schloss">🔒</span>'}</span><span class="name">${auf?"Kessel öffnen!":`Marktplatz · Kessel ${anzahlFertig()}/${islands.length} ✅`}</span>`;
  s.onclick=schatzKlick;
  meer.appendChild(s);
  updateStats();
}

/* ---------- Hexe läuft zum angetippten Haus ---------- */
const START=[50,63];
let bx=START[0],by=START[1],segelt=false;
function platziereBoot(){boot.style.left=bx+"%";boot.style.top=by+"%";}

function segleZu(i,ziel){
  if(segelt)return;
  if(i>=0&&fertig[i]){openIsland(i);return;}
  const P=i<0?SCHATZ:POS[i];
  const zx=i<0?P[0]:P[0]+(P[0]<50?17:-17),zy=i<0?P[1]+8:P[1]+3;
  if(zx<bx)boot.classList.add("links");else boot.classList.remove("links");
  const weit=Math.abs(zx-bx)>0.5||Math.abs(zy-by)>0.5;
  bx=zx;by=zy;platziereBoot();
  segelt=true;
  setTimeout(()=>{segelt=false;ziel?ziel():openIsland(i);},weit?1050:0);
}

function suesses(n){
  const box=document.getElementById("suess"),S=["🍬","🍭","🍫","🍩","🧁","🍪"];
  for(let i=0;i<n;i++){const e=document.createElement("span");e.textContent=pick(S);
    e.style.left=rnd(2,94)+"%";e.style.animationDelay=(Math.random()*.4)+"s";box.appendChild(e);setTimeout(()=>e.remove(),2200);}
}
function kacke(){
  const k=document.getElementById("kacke");
  k.classList.remove("zeigen");void k.offsetWidth;k.classList.add("zeigen");
}

function openIsland(i){
  if(fertig[i]){showCard(`<div class="gross">✅</div><p class="frage">Hier warst du schon: <b>${islands[i].name}</b> hat einen Haken!</p><p>Such dir ein Haus ohne Haken aus.</p><button class="knopf" onclick="closeCard()">OK</button>`);return;}
  cur=i;taskIdx=0;islandCoins=0;
  const g=shuffle([...islands[i].gens]);
  tasks=[];for(let k=0;k<PER_ISLAND;k++){const t=g[k%g.length]();
    for(const f of ["q","e","lw","bild","d"])t[f]=trenne(t[f]);if(t.o)t.o=t.o.map(trenne);tasks.push(t);}
  showTask();
}

function showCard(html){karte.innerHTML=html;overlay.style.display="flex";}
function closeCard(){overlay.style.display="none";}

function showTask(){
  tries=0;
  const t=tasks[taskIdx],isl=islands[cur];
  let dots="";for(let k=0;k<PER_ISLAND;k++)dots+=k<taskIdx?"🟡":k===taskIdx?"⭕":"⚪";
  showCard(`<button class="abbruch" onclick="abbruchFrage(true)">✕ Abbrechen</button>
    <div id="abbruch" class="abbruchbox" hidden><p><b>Wirklich abbrechen?</b></p>
      <p id="abbruchtext"></p>
      <button class="knopf" onclick="abbrechen()">Ja, zurück zur Karte</button><button class="knopf gruen" onclick="abbruchFrage(false)">Weiterspielen</button></div>
    <div class="kopf">${isl.icon} ${isl.name} – Aufgabe ${taskIdx+1} von ${PER_ISLAND}</div>
    <div class="punkte">${dots}</div>
    <p class="frage">${t.q}</p>${t.bild||""}
    ${t.o?`<div class="wahl" id="wahl"></div>`:`<div><input id="antwort" inputmode="decimal" autocomplete="off" placeholder="?"></div>`}
    <div id="knoepfe">${t.o?"":`<button class="knopf" onclick="check()">Prüfen ✔️</button>`}</div>
    <p id="feedback"></p>`);
  if(t.o){
    const w=document.getElementById("wahl");
    (t.fest?t.o.map((txt,i)=>({txt,i})):shuffle(t.o.map((txt,i)=>({txt,i})))).forEach(({txt,i})=>{
      const b=document.createElement("button");b.textContent=txt;b.dataset.i=i;
      b.onclick=()=>checkWahl(b,i);w.appendChild(b);
    });
    return;
  }
  const inp=document.getElementById("antwort");
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")check();});
  setTimeout(()=>inp.focus(),50);
}

const PUNKTE=[10,5,2];  // Süßigkeiten für den 1., 2. und 3. Versuch
const tippText=t=>t.e?`<span class="tipp">💡 Tipp: ${t.e}</span>`:"";
function richtig(t){const plus=PUNKTE[tries]||2;coins+=plus;islandCoins+=plus;updateStats();
  suesses(plus===10?10:plus===5?5:3);return `<span class="ok">🍬 Süßes! +${plus} Süßigkeiten</span>`;}

function check(){
  const inp=document.getElementById("antwort"),fb=document.getElementById("feedback");
  if(!inp||inp.disabled)return;
  const v=parseNum(inp.value);
  if(v===null){fb.innerHTML=`<span class="nein">Bitte gib eine Zahl ein.</span>`;return;}
  const t=tasks[taskIdx];
  if(Math.abs(v-t.a)<0.005){fb.innerHTML=richtig(t);inp.disabled=true;weiterKnopf(false);return;}
  tries++;kacke();
  if(tries===1){fb.innerHTML=`<span class="nein">🍋 Saures! Versuch es nochmal!</span>`;inp.value="";inp.focus();}
  else if(tries===2){fb.innerHTML=`<span class="nein">🍋 Saures! Noch ein Versuch – hier ist ein Tipp:</span>${tippText(t)}`;inp.value="";inp.focus();}
  else{fb.innerHTML=`<span class="nein">🍋 Saures! Die richtige Antwort ist ${t.d||fmt(t.a)}.</span>${t.e&&!t.lw?`<span class="tipp">💡 ${t.e}</span>`:""}`;
    inp.disabled=true;weiterKnopf(true);}
}

// Zahlen wie "1.234", "3,75", "45 €" oder "202 km" verstehen
function parseNum(s){
  s=s.trim().replace(/[^\d.,]/g,"");
  if(!/\d/.test(s))return null;
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");
  else if(!/^\d+\.\d{1,2}$/.test(s))s=s.replace(/\./g,"");
  return /^\d+(\.\d+)?$/.test(s)?parseFloat(s):null;
}

function checkWahl(btn,i){
  const t=tasks[taskIdx],fb=document.getElementById("feedback");
  const alle=[...document.querySelectorAll("#wahl button")];
  const ende=z=>{alle.forEach(b=>{b.disabled=true;if(+b.dataset.i===t.a)b.classList.add("richtig");});weiterKnopf(z);};
  if(i===t.a){fb.innerHTML=richtig(t);ende(false);return;}
  // so viele Versuche, wie es sinnvoll ist: höchstens 3, aber nie so viele, dass nur noch die richtige Antwort übrig bleibt
  const maxV=Math.min(3,t.o.length-1);
  tries++;kacke();btn.classList.add("falsch");btn.disabled=true;
  if(tries>=maxV){fb.innerHTML=`<span class="nein">🍋 Saures! Leider falsch.</span>`;ende(true);}
  else if(tries===1){fb.innerHTML=`<span class="nein">🍋 Saures! Versuch es nochmal!</span>`;}
  else{fb.innerHTML=`<span class="nein">🍋 Saures! Noch ein Versuch – hier ist ein Tipp:</span>${tippText(t)}`;}
}

function weiterKnopf(zeigen){
  const t=tasks[taskIdx];
  document.getElementById("knoepfe").innerHTML=(t.lw?`<button class="knopf blau" id="lwk" onclick="lwToggle()">📝 Lösungsweg</button>`:"")+`<button class="knopf gruen" id="weiter" onclick="next()">Weiter ➡️</button>`;
  if(t.lw){const d=document.createElement("div");d.id="lw";d.className="lw";d.innerHTML=`<div class="lwtitel">So rechnest du:</div>${t.lw}`;d.hidden=!zeigen;document.getElementById("feedback").after(d);}
  document.getElementById("weiter").focus();
}
function abbruchFrage(an){const d=document.getElementById("abbruch");if(!d)return;
  document.getElementById("abbruchtext").textContent=(islandCoins?`Die ${islandCoins} Süßigkeiten aus diesem Haus gehen dann verloren.`:"Du kannst das Haus später neu beginnen.")+" Das Haus bekommt noch keinen Haken.";
  d.hidden=!an;if(an)karte.scrollTop=0;}
function abbrechen(){coins-=islandCoins;islandCoins=0;closeCard();drawMap();}
function lwToggle(){const d=document.getElementById("lw");if(d)d.hidden=!d.hidden;}

function next(){taskIdx++;if(taskIdx<PER_ISLAND)showTask();else finish();}

function schatzKlick(){
  if(segelt)return;
  if(!alleFertig()){
    const fehlt=islands.filter((_,i)=>!fertig[i]).map(x=>`${x.icon} ${x.name}`);
    showCard(`<div class="gross">🎃🔒</div><p class="frage"><b>Der Kürbis-Kessel ist noch zugedeckelt.</b></p>
      <p>Erst wenn jedes Haus einen Haken ✅ hat, geht er auf. Dir fehl${fehlt.length>1?"en":"t"} noch:</p>
      <p class="fehlt">${fehlt.join("<br>")}</p><button class="knopf" onclick="closeCard()">OK</button>`);return;}
  segleZu(-1,schatzHeben);
}

function schatzHeben(){
    let neu="";
    if(coins>best){best=coins;try{localStorage.setItem("schatzinselRekord",best);}catch(e){}neu=`<p class="ok">🌟 NEUER REKORD! 🌟</p>`;}
    updateStats();
    suesses(24);
    showCard(`<div class="gross">🎃</div><p class="frage"><b>Happy Halloween! Du hast den großen Kürbis-Kessel geöffnet!</b></p>
      <div class="gross">🍬🍭🍫</div>
      <p class="frage">Du hast <b>${coins}</b> von ${islands.length*PER_ISLAND*10} Süßigkeiten gesammelt.</p>
      ${neu}<p>Dein Rekord: <b>${best}</b> Süßigkeiten</p>
      <button class="knopf gruen" onclick="neuesSpiel()">🔄 Nochmal spielen</button>`);
}

function finish(){
  fertig[cur]=true;drawMap();
  const rest=islands.length-anzahlFertig();
  showCard(`<div class="gross">✅</div><p class="frage"><b>${islands[cur].name} geschafft!</b></p>
    <p>In diesem Haus: <b>${islandCoins}</b> von ${PER_ISLAND*10} Süßigkeiten 🍬</p>
    <p>${rest?`Noch <b>${rest}</b> ${rest>1?"Häuser":"Haus"} ohne Haken, dann öffnet sich der Kürbis-Kessel!`:"🎉 Jedes Haus hat einen Haken! Lauf jetzt zum Kürbis-Kessel am Marktplatz!"}</p>
    <button class="knopf gruen" onclick="closeCard()">Zur Karte 🗺️</button>`);
}

function neuesSpiel(){
  coins=0;fertig=[];closeCard();
  bx=START[0];by=START[1];
  platziereBoot();drawMap();
}

drawMap();platziereBoot();
</script>
</body>
</html>
